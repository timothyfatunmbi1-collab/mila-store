<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mila Varieties Store - Order on WhatsApp</title>
<meta name="description" content="Browse all products, see prices and availability, order straight to WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mila Varieties Store - Order on WhatsApp">
<meta property="og:description" content="Browse all products, see prices and availability, order straight to WhatsApp.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1 id="shopNameEl">Your Store</h1>
      <p id="shopTagEl" class="tagline">Tap any product to order on WhatsApp</p>
    </div>
    <a id="chatShopBtn" class="chat-shop" href="#" target="_blank" rel="noopener">Chat shop</a>
  </div>
  <div class="search-row">
    <input id="searchInput" type="search" placeholder="Search hoodie, gown, size M..." autocomplete="off">
    <label class="avail-only"><input type="checkbox" id="availOnly" checked> Available</label>
  </div>
  <p id="countEl" class="count"></p>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="emptyEl" class="empty" hidden>No match. Try another word.</div>
  <div id="singleWrap" class="single-wrap" hidden>
    <button id="backBtn" class="back-btn">&larr; All products</button>
  </div>
</main>
<footer class="footer">
  <p id="footEl">Pay on delivery / transfer. Delivery info on WhatsApp.</p>
</footer>
<script src="./app.js"></script>
</body>
</html>
